# Fly.io config. Rooms are kept in memory, so run exactly ONE machine and keep it running.
# Deploy:  fly launch --no-deploy --copy-config  (choose your own unique app name)
#          fly scale count 1
#          fly deploy
app = "breakout-beasts-CHANGE-ME"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
