# Render Blueprint (alternative host). One instance only: rooms are kept in memory.
services:
  - type: web
    name: breakout-beasts
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
